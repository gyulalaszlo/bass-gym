[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
bg-core = { path = "crates/bg-core" }
bg-dsp = { path = "crates/bg-dsp" }
bg-sound = { path = "crates/bg-sound" }
bg-audio = { path = "crates/bg-audio" }
bg-report = { path = "crates/bg-report" }
bg-ui = { path = "crates/bg-ui" }
bg-exercises = { path = "crates/bg-exercises" }

eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "persistence"] }
egui = "0.36"
egui-phosphor = "0.14"
cpal = "0.18"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
rand_chacha = "0.9"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.dev.package.bg-dsp]
opt-level = 3
